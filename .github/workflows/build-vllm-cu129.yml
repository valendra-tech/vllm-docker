name: Build vLLM 0.34.0 with CUDA 12.9

on:
  workflow_call:

permissions:
  contents: read

env:
  VLLM_COMMIT: 62d4bc3c7e33b1b6c906e233e6af2d3506c482ca
  TAG: v0.34.0-cu129-ubuntu2404
  CUDA_BUILD_IMAGE: docker.io/pytorch/manylinux2_28-builder@sha256:d26cd7a9489b53310296e86042de630ac947e25a71dd24b547b86ca9a0a3fc79
  CUDA_RUNTIME_IMAGE: docker.io/nvidia/cuda@sha256:29e5e3425e2e0f5a4e97c9fb4695ba4887cd78210a43cf94c3bcafc6ab01c5e6
  R2_BUCKET: public-docker-registry
  R2_REGISTRY_DOMAIN: public-docker-registry.valendra.net

jobs:
  build-and-publish:
    name: Build and publish CUDA 12.9 release (amd64)
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-vllm-v0.34.0-cu129
      cancel-in-progress: false
    steps:
      - name: Install Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Check the R2 release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag_url="https://${R2_REGISTRY_DOMAIN}/v2/vllm/manifests/${TAG}"
          status="$(curl --silent --show-error --location --retry 3 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "${tag_url}")"
          case "${status}" in
            404) echo 'exists=false' >> "${GITHUB_OUTPUT}" ;;
            200)
              skopeo inspect --no-tags --retry-times 3 "docker://${R2_REGISTRY_DOMAIN}/vllm:${TAG}" |
                jq -e --arg commit "${VLLM_COMMIT}" --arg tag "${TAG}" '
                  .Architecture == "amd64" and .Os == "linux" and
                  .Labels["org.opencontainers.image.revision"] == $commit and
                  .Labels["org.opencontainers.image.version"] == $tag and
                  any(.Env[]?; . == "CUDA_VERSION=12.9.1")
                ' > /dev/null
              echo "${TAG} is already published"
              echo 'exists=true' >> "${GITHUB_OUTPUT}"
              ;;
            *) echo "Unexpected R2 registry status ${status} for ${TAG}" >&2; exit 1 ;;
          esac

      - name: Check out repository
        if: steps.tag.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out vLLM v0.34.0 source
        if: steps.tag.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: refs/tags/v0.34.0
          path: upstream-vllm
          persist-credentials: false

      - name: Apply CUDA 12.9 dependency pins
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C upstream-vllm rev-parse HEAD)"
          if [[ "${actual_commit}" != "${VLLM_COMMIT}" ]]; then
            echo "Expected pinned vLLM revision ${VLLM_COMMIT}, got ${actual_commit}" >&2
            exit 1
          fi
          git -C upstream-vllm apply --whitespace=error "${GITHUB_WORKSPACE}/patches/vllm-0.34.0-cu129.patch"

      - name: Free space for the CUDA build
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "${RUNNER_TEMP}"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build, smoke-test, and export OCI image
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file upstream-vllm/docker/Dockerfile \
            --target vllm-openai \
            --tag "vllm:${TAG}" \
            --provenance=false \
            --sbom=false \
            --output "type=oci,tar=false,dest=${RUNNER_TEMP}/vllm-cu129" \
            --build-arg CUDA_VERSION=12.9.1 \
            --build-arg "BUILD_BASE_IMAGE=${CUDA_BUILD_IMAGE}" \
            --build-arg "FINAL_BASE_IMAGE=${CUDA_RUNTIME_IMAGE}" \
            --build-arg 'torch_cuda_arch_list=7.5 8.0 8.6 8.9 9.0 10.0 10.3 12.0' \
            --build-arg max_jobs=3 \
            --build-arg nvcc_threads=2 \
            --label 'org.opencontainers.image.source=https://github.com/vllm-project/vllm' \
            --label "org.opencontainers.image.revision=${VLLM_COMMIT}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --progress plain \
            upstream-vllm

      - name: Publish and verify the R2 manifest
        if: steps.tag.outputs.exists == 'false'
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          IMMUTABLE_TAG: '1'
        shell: bash
        run: |
          set -euo pipefail
          layout="${RUNNER_TEMP}/vllm-cu129"
          local_digest="$(skopeo inspect --no-tags --format '{{.Digest}}' "oci:${layout}:${TAG}")"
          ./scripts/push-r2.sh "${layout}" "${TAG}"
          remote_digest="$(skopeo inspect --no-tags --retry-times 3 --format '{{.Digest}}' \
            "docker://${R2_REGISTRY_DOMAIN}/vllm:${TAG}")"
          if [[ "${remote_digest}" != "${local_digest}" ]]; then
            echo "Published digest ${remote_digest} does not match local digest ${local_digest}" >&2
            exit 1
          fi
          echo "Published ${R2_REGISTRY_DOMAIN}/vllm:${TAG} at ${remote_digest}"

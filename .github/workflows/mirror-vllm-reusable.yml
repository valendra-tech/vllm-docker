name: Mirror vLLM image

on:
  workflow_call:
    inputs:
      vllm_ref:
        description: vLLM release or full nightly commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_IMAGE: docker.io/vllm/vllm-openai
  R2_BUCKET: public-docker-registry
  R2_REGISTRY_DOMAIN: public-docker-registry.valendra.net

jobs:
  validate_ref:
    name: Validate vLLM reference
    runs-on: ubuntu-latest
    outputs:
      vllm_ref: ${{ steps.ref.outputs.vllm_ref }}
      ref_type: ${{ steps.ref.outputs.ref_type }}
    steps:
      - name: Normalize reference
        id: ref
        env:
          INPUT_REF: ${{ inputs.vllm_ref }}
        shell: bash
        run: |
          set -euo pipefail

          reference="${INPUT_REF#v}"
          if [[ "$reference" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref_type="release"
          elif [[ "$reference" =~ ^[0-9a-f]{40}$ ]]; then
            ref_type="nightly"
          else
            echo "vllm_ref must match X.Y.Z, vX.Y.Z, or a 40-character lowercase commit SHA" >&2
            exit 1
          fi

          echo "vllm_ref=$reference" >> "$GITHUB_OUTPUT"
          echo "ref_type=$ref_type" >> "$GITHUB_OUTPUT"

  mirror:
    name: Mirror ${{ matrix.cuda }} ${{ needs.validate_ref.outputs.ref_type }}
    needs: validate_ref
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: cu129
            release_tag_suffix: -cu129-ubuntu2404
            nightly_tag_prefix: cu129-nightly-
          - cuda: cu13
            release_tag_suffix: -ubuntu2404
            nightly_tag_prefix: nightly-
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "awscliv2.zip"
          unzip -tq awscliv2.zip
          unzip -q awscliv2.zip && sudo ./aws/install --update

      - name: Mirror image to R2
        env:
          VLLM_REF: ${{ needs.validate_ref.outputs.vllm_ref }}
          REF_TYPE: ${{ needs.validate_ref.outputs.ref_type }}
          RELEASE_TAG_SUFFIX: ${{ matrix.release_tag_suffix }}
          NIGHTLY_TAG_PREFIX: ${{ matrix.nightly_tag_prefix }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          case "$REF_TYPE" in
            release)
              source_tag="v${VLLM_REF}${RELEASE_TAG_SUFFIX}"
              ;;
            nightly)
              source_tag="${NIGHTLY_TAG_PREFIX}${VLLM_REF}"
              ;;
            *)
              echo "Unsupported vLLM reference type: ${REF_TYPE}" >&2
              exit 1
              ;;
          esac

          source_image="${SOURCE_IMAGE}:${source_tag}"
          registry_image="${R2_REGISTRY_DOMAIN}/vllm:${source_tag}"

          echo "Copying ${source_image} to OCI layout"
          layout_dir="$(mktemp -d)"
          trap 'rm -rf "${layout_dir}"' EXIT
          skopeo copy --all --retry-times 3 \
            "docker://${source_image}" \
            "oci:${layout_dir}:${source_tag}"

          echo "Uploading to R2 bucket ${R2_BUCKET}"
          ./scripts/push-r2.sh "${layout_dir}" "${source_tag}"

          echo "Validating ${registry_image}"
          skopeo inspect --retry-times 3 "docker://${registry_image}"

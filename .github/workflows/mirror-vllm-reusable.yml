name: Mirror vLLM image

on:
  workflow_call:
    inputs:
      vllm_ref:
        description: vLLM release or full nightly commit SHA
        required: true
        type: string
      build_cu129:
        description: Build the pinned CUDA 12.9 release if its upstream image is absent
        type: boolean
        default: false

permissions:
  contents: read

env:
  UPSTREAM_IMAGE: docker.io/vllm/vllm-openai
  R2_BUCKET: public-docker-registry
  R2_REGISTRY_DOMAIN: public-docker-registry.valendra.net

jobs:
  validate_ref:
    name: Resolve vLLM image tags
    runs-on: ubuntu-latest
    outputs:
      ref_type: ${{ steps.ref.outputs.ref_type }}
      matrix: ${{ steps.ref.outputs.matrix }}
      build_cu129: ${{ steps.ref.outputs.build_cu129 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve source and destination tags
        id: ref
        env:
          INPUT_REF: ${{ inputs.vllm_ref }}
        shell: bash
        run: bash scripts/resolve-mirror-tags.sh "${INPUT_REF}" >> "${GITHUB_OUTPUT}"

  mirror:
    name: Mirror ${{ matrix.cuda }} ${{ needs.validate_ref.outputs.ref_type }}
    needs: validate_ref
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate_ref.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "awscliv2.zip"
          unzip -tq awscliv2.zip
          unzip -q awscliv2.zip && sudo ./aws/install --update

      - name: Mirror image to R2
        env:
          SOURCE_TAG: ${{ matrix.source_tag }}
          DEST_TAG: ${{ matrix.dest_tag }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          source_image="${UPSTREAM_IMAGE}:${SOURCE_TAG}"
          registry_image="${R2_REGISTRY_DOMAIN}/vllm:${DEST_TAG}"
          if [[ "${SOURCE_TAG}" != "${DEST_TAG}" ]]; then
            if ! skopeo inspect --config --retry-times 3 "docker://${source_image}" |
              jq -e 'any(.config.Env[]?; startswith("CUDA_VERSION=13."))' > /dev/null; then
              echo "Could not verify CUDA 13 for ${source_image}" >&2
              exit 1
            fi
          fi

          echo "Copying ${source_image} to OCI layout"
          layout_dir="$(mktemp -d)"
          trap 'rm -rf "${layout_dir}"' EXIT
          skopeo copy --all --retry-times 3 \
            "docker://${source_image}" \
            "oci:${layout_dir}:${DEST_TAG}"

          echo "Uploading to R2 bucket ${R2_BUCKET}"
          ./scripts/push-r2.sh "${layout_dir}" "${DEST_TAG}"

          echo "Validating ${registry_image}"
          skopeo inspect --no-tags --retry-times 3 "docker://${registry_image}"

  build_cu129:
    name: Build missing CUDA 12.9 release
    needs: validate_ref
    if: inputs.build_cu129 && needs.validate_ref.outputs.build_cu129 == 'true'
    uses: ./.github/workflows/build-vllm-cu129.yml
    secrets: inherit

name: Mirror latest vLLM image

on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-latest-version:
    name: Find latest stable release
    runs-on: ubuntu-latest
    outputs:
      vllm_ref: ${{ steps.latest.outputs.vllm_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find latest CUDA release on Docker Hub
        id: latest
        shell: bash
        run: |
          set -euo pipefail

          latest_version="$(bash scripts/find-latest-vllm-ref.sh)"
          echo "Latest stable vLLM version: v${latest_version}"
          echo "vllm_ref=${latest_version}" >> "$GITHUB_OUTPUT"

  mirror:
    name: Mirror latest version
    needs: find-latest-version
    uses: ./.github/workflows/mirror-vllm-reusable.yml
    with:
      vllm_ref: ${{ needs.find-latest-version.outputs.vllm_ref }}
    secrets: inherit
